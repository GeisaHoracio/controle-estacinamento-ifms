
services:
  db:
    image: mysql:8.0
    container_name: estacionamento_fms_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: estacionamento_fms
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - dados_mysql:/var/lib/mysql
    restart: unless-stopped

volumes:
  dados_mysql:
